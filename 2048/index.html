<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1a17" />
    <meta name="description" content="2048 - slide the tiles, merge equal numbers, and reach 2048." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <title>2048</title>
  </head>
  <body>
    <a class="back" href="/"><span aria-hidden="true">←</span> Games</a>
    <main>
      <div class="top">
        <h1>2048</h1>
        <div class="scores">
          <p class="score-box">Score <span id="score">0</span></p>
          <p class="score-box">Best <span id="best">0</span></p>
        </div>
      </div>
      <p class="hint">Arrow keys, WASD or swipe. Equal tiles merge. Reach 2048.</p>
      <div id="board" class="board"></div>
      <p id="status" class="status" aria-live="polite"></p>
      <button type="button" id="new-game" class="new-game">New game</button>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
