<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101a3a" />
    <meta name="description" content="Four in a Row - two players, one screen. Drop discs and line up four to win." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <title>Four in a Row</title>
  </head>
  <body>
    <a class="back" href="/"><span aria-hidden="true">←</span> Games</a>
    <main>
      <h1>Four in a Row</h1>
      <p class="hint">Two players, one screen. Take turns dropping discs. Line up four to win.</p>
      <p id="scores" class="scores"></p>
      <p id="status" class="status" aria-live="polite"></p>
      <fieldset class="board-frame">
        <legend class="sr-only">Board</legend>
        <div id="board" class="board"></div>
      </fieldset>
      <p class="keys">Keys: 1–7 drop into a column, ← → move between columns.</p>
      <button type="button" id="new-round" class="new-round">Restart round</button>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
