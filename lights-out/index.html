<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#140f24" />
    <meta name="description" content="Lights Out - tap a light to flip it and its neighbours. Turn them all off." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <title>Lights Out</title>
  </head>
  <body>
    <a class="back" href="/" aria-label="Back to all games">← Games</a>
    <main>
      <h1>Lights Out</h1>
      <p class="hint">Each light flips itself and its neighbours. Turn every light off.</p>
      <p class="stats"><span id="level"></span> · <span id="moves"></span> · <span id="best"></span></p>
      <div id="board" class="board" role="group" aria-label="Lights"></div>
      <p id="result" class="result" aria-live="polite"></p>
      <div class="actions">
        <button type="button" id="next" class="primary" hidden>Next level</button>
        <button type="button" id="restart">Restart level</button>
        <button type="button" id="reset">Back to level 1</button>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
